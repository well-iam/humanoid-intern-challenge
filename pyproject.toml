[project]
name = "pushing-world-model"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "gym-pusht==0.1.8",
    "imageio>=2.38.1",
    "matplotlib>=3.11.2",
    "mink==1.3.0",
    "mujoco==3.16.0",
    "numpy>=2.5.4",
    "pillow>=12.3.0",
    "torch==2.11.0",
    "transformers==5.19.0",
    "zarr==3.4.1",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv.build-backend]
module-name = "pwm"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs external data or a simulator; run with -m slow"]
addopts = "-m 'not slow'"
